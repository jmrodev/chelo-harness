name: Release Package & Binary Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: 📦 Package & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🗜️ Archive Artifacts
        run: |
          tar -czvf chelo-harness-bundle.tar.gz bin/ lib/ agents/ install.sh README.md

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: chelo-harness-bundle.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
